server:
  port: ${SERVER_PORT:9090}
  servlet:
    context-path: /

# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:danmaku_video}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:@Cqy15850479975}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      jedis:
        pool:
          max-active: 20
          max-idle: 10
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.danmaku.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT配置
jwt:
  secret: aa32f93c2e714d2891a7d1234abcdef56789abcdef0123456789
  expire: 86400000 # 过期时间：24小时
  header: Access-Token

# 日志配置
logging:
  level:
    com.danmaku: info
    org.springframework: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

app:
  base-url: ${APP_BASE_URL:http://120.55.191.140:9090}
  chat:
    message-cache-size: ${CHAT_MESSAGE_CACHE_SIZE:200}
    message-cache-ttl-hours: ${CHAT_MESSAGE_CACHE_TTL_HOURS:24}
