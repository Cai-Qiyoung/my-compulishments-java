# 服务器配置
server:
  port: ${SERVER_PORT:9090}
  servlet:
    context-path: /

# Spring 核心配置
spring:
  # 环境配置
  profiles:
    active: dev

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:danmaku_video}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:@Cqy15850479975}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10000
      jedis:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 1000MB
      max-request-size: 1000MB

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.danmaku.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  secret: aa32f93c2e714d2891a7d1234abcdef56789abcdef0123456789
  expire: 86400000
  header: Access-Token

# 日志配置
logging:
  config: classpath:logback-spring.xml
  level:
    com.danmaku: info
    org.springframework: warn
    org.mybatis: warn

app:
  base-url: ${APP_BASE_URL:http://120.55.191.140:9090}
  chat:
    message-cache-size: ${CHAT_MESSAGE_CACHE_SIZE:200}
    message-cache-ttl-hours: ${CHAT_MESSAGE_CACHE_TTL_HOURS:24}
